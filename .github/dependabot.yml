version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      x402:
        dependency-type: production
        patterns:
          - "@x402/*"
        update-types:
          - minor
          - patch
      web-runtime:
        dependency-type: production
        patterns:
          - next
          - react
          - react-dom
          - "@wallet-standard/*"
        update-types:
          - minor
          - patch
      gateway-runtime:
        dependency-type: production
        patterns:
          - express
          - express-rate-limit
          - cors
          - zod
          - bs58
        update-types:
          - minor
          - patch
      production-other:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Major upgrades are migration projects, not unattended maintenance. They
      # are reviewed from official release notes on a dedicated branch so
      # coupled packages (notably Solana Kit/sysvars) move together.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Etc/UTC
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5
