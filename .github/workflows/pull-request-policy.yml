name: Pull request policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate conventional pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore|ci|deps|build|refactor|perf|test|revert)(\([a-z0-9][a-z0-9-]*\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo 'Pull request title must follow: type(optional-scope): description'
            echo 'Allowed types: feat, fix, docs, chore, ci, deps, build, refactor, perf, test, revert.'
            exit 1
          fi
