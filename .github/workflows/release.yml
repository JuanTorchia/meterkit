name: Stage npm packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify packages without publishing
        type: boolean
        default: true
      registry_version:
        description: Exact already-published version to verify from npm
        type: string
        required: false

permissions:
  actions: read
  checks: read
  # The SBOM action attaches the generated SPDX document to the GitHub release.
  contents: write
  id-token: write

jobs:
  publish:
    if: github.event_name == 'release' || inputs.registry_version == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-stage
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meterkit
          POSTGRES_PASSWORD: meterkit
          POSTGRES_DB: meterkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meterkit"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.10.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install staged-publishing npm CLI
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Require successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" --jq '[.check_runs[] | select(.name == "verify") | .conclusion] | last')"
          test "$conclusion" = "success"

      - name: Download exact-commit dependency evidence
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          asset="dependency-evidence-${GITHUB_SHA}.json"
          gh release download "$RELEASE_TAG" --pattern "$asset" --dir "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/$asset" "$RUNNER_TEMP/meterkit-dependency-evidence.json"

      - name: Require complete dependency evidence
        if: github.event_name == 'release'
        run: node scripts/dependency-risk/release-check.mjs "$RUNNER_TEMP/meterkit-dependency-evidence.json"

      - name: Verify release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/verify-release-version.mjs "$RELEASE_TAG"

      - name: Require clean release source
        if: github.event_name == 'release'
        run: test -z "$(git status --porcelain)"

      - name: Verify packages
        run: pnpm release:verify

      - name: Verify self-service claims
        run: node scripts/verify-self-service-claims.mjs

      - name: Generate exact-tag release manifest
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DEPENDENCY_EVIDENCE_PATH: ${{ runner.temp }}/meterkit-dependency-evidence.json
        # release:verify generates tracked benchmark/evidence outputs. Source
        # cleanliness is enforced immediately before that command.
        run: node scripts/generate-release-manifest.mjs "$RELEASE_TAG" --allow-dirty

      - name: Verify professional evidence for this revision
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: pnpm world-class:evidence

      - name: Pack the exact approved artifacts
        run: |
          mkdir -p artifacts/npm
          pnpm --filter @usemeterkit/core pack --pack-destination "$GITHUB_WORKSPACE/artifacts/npm"
          pnpm --filter @usemeterkit/database pack --pack-destination "$GITHUB_WORKSPACE/artifacts/npm"
          pnpm --filter @usemeterkit/sdk pack --pack-destination "$GITHUB_WORKSPACE/artifacts/npm"
          pnpm --filter @usemeterkit/cli pack --pack-destination "$GITHUB_WORKSPACE/artifacts/npm"
          pnpm --filter create-meterkit pack --pack-destination "$GITHUB_WORKSPACE/artifacts/npm"

      - name: Generate package SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          artifact-name: meterkit-source-${{ github.sha }}.spdx.json

      - name: Stage approved public packages through OIDC
        if: github.event_name == 'release' && github.event.release.prerelease == false
        run: |
          for artifact in artifacts/npm/*.tgz; do
            npm stage publish "$artifact" --access public
          done

  registry-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.registry_version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, pnpm]
        surface: [express, next-route, hono, mcp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.10.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @usemeterkit/core build
      - name: Verify exact public artifact
        env:
          METERKIT_REGISTRY_VERSION: ${{ inputs.registry_version }}
          METERKIT_QUICKSTART_MANAGERS: ${{ matrix.manager }}
          METERKIT_QUICKSTART_SURFACES: ${{ matrix.surface }}
        run: node scripts/verify-registry-quickstarts.mjs > registry-smoke.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-smoke-${{ inputs.registry_version }}-${{ matrix.manager }}-${{ matrix.surface }}
          path: registry-smoke.json

  registry-promotion-decision:
    if: github.event_name == 'workflow_dispatch' && inputs.registry_version != ''
    needs: registry-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.10.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @usemeterkit/core build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: registry-smoke-${{ inputs.registry_version }}-*
          path: registry-smoke-results
      - name: Require every exact registry cell before recommendation
        env:
          METERKIT_REGISTRY_VERSION: ${{ inputs.registry_version }}
        run: node scripts/aggregate-registry-smoke.mjs registry-smoke-results > registry-promotion.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-promotion-${{ inputs.registry_version }}
          path: registry-promotion.json
