name: Stage npm packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify packages without publishing
        type: boolean
        default: true

permissions:
  checks: read
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-stage
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.10.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install staged-publishing npm CLI
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" --jq '[.check_runs[] | select(.name == "verify") | .conclusion] | last')"
          test "$conclusion" = "success"

      - name: Verify release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/verify-release-version.mjs "$RELEASE_TAG"

      - name: Verify packages
        run: pnpm release:verify

      - name: Generate exact-tag release manifest
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/generate-release-manifest.mjs "$RELEASE_TAG"

      - name: Verify professional evidence for this revision
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: pnpm world-class:evidence

      - name: Pack the exact approved artifacts
        run: |
          mkdir -p artifacts/npm
          pnpm --filter @usemeterkit/core pack --pack-destination "$GITHUB_WORKSPACE/artifacts/npm"
          pnpm --filter @usemeterkit/sdk pack --pack-destination "$GITHUB_WORKSPACE/artifacts/npm"

      - name: Generate package SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          artifact-name: meterkit-source-${{ github.sha }}.spdx.json

      - name: Stage approved public packages through OIDC
        if: github.event_name == 'release' && github.event.release.prerelease == false
        run: |
          for artifact in artifacts/npm/*.tgz; do
            npm stage publish "$artifact" --access public
          done
