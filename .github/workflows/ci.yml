name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  packed-quickstart:
    name: packed-${{ matrix.manager }}-${{ matrix.surface }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, pnpm]
        surface: [express, next-route, hono]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.10.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Execute packed public commands
        env:
          METERKIT_QUICKSTART_MANAGERS: ${{ matrix.manager }}
          METERKIT_QUICKSTART_SURFACES: ${{ matrix.surface }}
        run: pnpm quickstart:clean

  experimental-mcp:
    name: experimental-mcp-${{ matrix.manager }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        manager: [npm, pnpm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.10.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - env:
          METERKIT_QUICKSTART_MANAGERS: ${{ matrix.manager }}
          METERKIT_QUICKSTART_SURFACES: mcp
        run: pnpm quickstart:clean

  portability:
    name: portability-${{ matrix.os }}-${{ matrix.surface }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        surface: [express, next-route]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.10.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - env:
          METERKIT_QUICKSTART_MANAGERS: npm
          METERKIT_QUICKSTART_SURFACES: ${{ matrix.surface }}
        run: pnpm quickstart:clean

  package-manager-experiments:
    name: experimental-${{ matrix.manager }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        manager: [yarn, bun]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.10.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm --filter create-meterkit... build
      - run: pnpm --filter create-meterkit test

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meterkit
          POSTGRES_PASSWORD: meterkit
          POSTGRES_DB: meterkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meterkit"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.10.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        env:
          DATABASE_TEST_URL: postgresql://meterkit:meterkit@localhost:5432/meterkit
        run: pnpm test

      - name: Verify bilingual documentation parity
        run: pnpm docs:verify

      - name: Verify published version claims
        run: pnpm version:verify

      - name: Verify self-service release claims
        run: node scripts/verify-self-service-claims.mjs

      - name: Verify packed packages resolve
        run: pnpm package:verify

      - name: Verify contributor path
        run: pnpm contributor:verify

      - name: Production build
        run: pnpm build

      - name: Verify clean package quickstart
        run: pnpm quickstart:clean

      - name: Verify compatibility matrix
        run: pnpm compatibility:verify

      - name: Verify benchmark and resilience evidence
        run: pnpm benchmark

      - name: Generate exact-commit professional evidence
        run: pnpm world-class:evidence

      - name: Verify all supported integration surfaces
        run: pnpm --filter @usemeterkit/hono-quickstart test

      - name: End-to-end test
        run: pnpm test:e2e

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Scan repository for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"

      - name: Build gateway image
        run: docker build --file Dockerfile.gateway --tag meterkit-gateway:${{ github.sha }} .

      - name: Build web image
        run: >-
          docker build --file Dockerfile.web
          --build-arg NEXT_PUBLIC_GATEWAY_URL=https://meterkit-api.juanchi.dev
          --tag meterkit-web:${{ github.sha }} .

      - name: Scan gateway image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: meterkit-gateway:${{ github.sha }}
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: meterkit-web:${{ github.sha }}
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate gateway SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: meterkit-gateway:${{ github.sha }}
          artifact-name: meterkit-gateway-${{ github.sha }}.spdx.json

      - name: Generate web SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: meterkit-web:${{ github.sha }}
          artifact-name: meterkit-web-${{ github.sha }}.spdx.json
