name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meterkit
          POSTGRES_PASSWORD: meterkit
          POSTGRES_DB: meterkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meterkit"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.10.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        env:
          DATABASE_TEST_URL: postgresql://meterkit:meterkit@localhost:5432/meterkit
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: End-to-end test
        run: pnpm test:e2e

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Build gateway image
        run: docker build --file Dockerfile.gateway --tag meterkit-gateway:${{ github.sha }} .

      - name: Build web image
        run: >-
          docker build --file Dockerfile.web
          --build-arg NEXT_PUBLIC_GATEWAY_URL=https://meterkit-api.juanchi.dev
          --tag meterkit-web:${{ github.sha }} .

      - name: Scan gateway image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: meterkit-gateway:${{ github.sha }}
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: meterkit-web:${{ github.sha }}
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate gateway SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: meterkit-gateway:${{ github.sha }}
          artifact-name: meterkit-gateway-${{ github.sha }}.spdx.json

      - name: Generate web SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: meterkit-web:${{ github.sha }}
          artifact-name: meterkit-web-${{ github.sha }}.spdx.json
