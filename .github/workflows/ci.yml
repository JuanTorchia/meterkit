name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meterkit
          POSTGRES_PASSWORD: meterkit
          POSTGRES_DB: meterkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meterkit"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        env:
          DATABASE_TEST_URL: postgresql://meterkit:meterkit@localhost:5432/meterkit
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: End-to-end test
        run: pnpm test:e2e
