services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: meterkit
      POSTGRES_PASSWORD: meterkit
      POSTGRES_DB: meterkit
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meterkit"]
      interval: 3s
      timeout: 3s
      retries: 10
